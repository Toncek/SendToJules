<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Jules Command Center - Nastavenia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options-page">
  <h1>Settings</h1>

  <div class="form-group mb-2">
    <label for="apiKey">Jules API Key (X-Goog-Api-Key)</label>
    <div style="position: relative; display: flex;">
      <input type="password" id="apiKey" placeholder="Enter your API key" style="padding-right: 40px;">
      <button type="button" id="btnToggleKey" style="position: absolute; right: 0; top: 0; bottom: 0; background: none; border: none; color: var(--text-color); cursor: pointer; padding: 0 10px;">👁</button>
    </div>
  </div>

  <div class="form-group mb-2">
    <label for="defaultBranch">Default branch</label>
    <input type="text" id="defaultBranch" placeholder="e.g. main">
  </div>

  <div class="checkbox-group mb-2 mt-2">
    <input type="checkbox" id="chkRequireApproval">
    <label for="chkRequireApproval">Always require plan approval (requirePlanApproval)</label>
  </div>

  <div class="checkbox-group mb-2">
    <input type="checkbox" id="chkAutoPr">
    <label for="chkAutoPr">Automatically create Pull Request (AUTO_CREATE_PR)</label>
  </div>

  <div class="checkbox-group mb-2">
    <input type="checkbox" id="chkNotifications">
    <label for="chkNotifications">Enable desktop notifications for session status</label>
  </div>

  <h3 class="mt-2">Custom Prompt Presets</h3>
  <div class="form-group mb-2">
    <div class="flex-row">
      <input type="text" id="newPresetInput" placeholder="New preset..." style="flex: 1;">
      <button id="btnAddPreset" class="btn">Add</button>
    </div>
  </div>
  <div id="presetList" class="session-list mb-2">
    <!-- Rendered via JS -->
  </div>

  <div id="statusMessage" class="toast"></div>

  <div class="flex-row mt-2" style="margin-top: 24px;">
    <button id="btnSave" class="btn btn-primary">Save Settings</button>
    <button id="btnTest" class="btn">Test Connection & Sync Repositories</button>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="options.js"></script>
</body>
</html>
