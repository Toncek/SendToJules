<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Jules Command Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" data-target="tab-new-task">Nová úloha</button>
    <button class="tab-btn" data-target="tab-sessions">Aktívne Sessions</button>
  </div>

  <!-- Tab 1: New Task -->
  <div id="tab-new-task" class="tab-content active">

    <!-- Smart Repo Selector -->
    <div class="form-group">
      <label for="repoSearch">Repozitár <span id="repoDetectedBadge" class="badge badge-success hidden">Detegované z GitHub URL</span></label>
      <div class="flex-row">
        <input type="text" id="repoSearch" placeholder="Hľadať alebo vybrať repozitár..." list="repoDatalist" autocomplete="off">
        <button id="btnOptions" class="btn" title="Nastavenia">⚙</button>
      </div>
      <datalist id="repoDatalist"></datalist>
      <div id="quickSelectContainer" class="chip-container mt-2">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Prompt Area -->
    <div class="form-group mb-2">
      <label>Šablóny inštrukcií (Presets)</label>
      <div id="presetContainer" class="chip-container">
        <!-- Injected via JS -->
      </div>
    </div>

    <div class="form-group">
      <label for="promptText">Zadanie (Prompt)</label>
      <textarea id="promptText" placeholder="Zadajte inštrukcie pre Jules... (Ctrl+Enter pre odoslanie)"></textarea>
    </div>

    <div class="form-group mt-2">
      <div class="checkbox-group">
        <input type="checkbox" id="chkAppendUrl">
        <label for="chkAppendUrl">Priložiť URL zdrojovej stránky</label>
      </div>
    </div>

    <div class="flex-row mt-2">
      <div class="form-group" style="flex: 1;">
        <label for="inputBranch">Vetva (Branch)</label>
        <input type="text" id="inputBranch" placeholder="napr. main">
      </div>
    </div>

    <div class="flex-row mt-2">
      <div class="checkbox-group" style="flex: 1;">
        <input type="checkbox" id="chkRequireApproval">
        <label for="chkRequireApproval">Vyžadovať schválenie plánu</label>
      </div>
      <div class="checkbox-group" style="flex: 1;">
        <input type="checkbox" id="chkAutoPr">
        <label for="chkAutoPr">Automaticky PR</label>
      </div>
    </div>

    <!-- Status Output -->
    <div id="statusMessage" class="toast"></div>

    <div class="mt-2" style="margin-top: auto;">
      <button id="btnSubmit" class="btn btn-primary" style="width: 100%;">
        Vytvoriť Session (Ctrl+Enter)
      </button>
    </div>
  </div>

  <!-- Tab 2: Sessions Monitor -->
  <div id="tab-sessions" class="tab-content">
    <div class="flex-row justify-between mb-2">
      <h2>Sledované úlohy</h2>
      <button id="btnRefreshSessions" class="btn">↻ Obnoviť</button>
    </div>

    <div id="sessionsList" class="session-list">
      <!-- Injected via JS -->
      <div class="text-center" style="color: var(--text-muted);">Žiadne aktívne sessions.</div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
