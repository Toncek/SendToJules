<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Jules Command Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="onboarding-state" class="hidden text-center" style="padding: 20px;">
    <h2>Welcome to Send to Jules</h2>
    <p style="color: var(--text-muted); margin-bottom: 20px;">Please configure your API key to start using Jules.</p>
    <button id="btnOpenOptions" class="btn btn-primary" style="width: 100%;">Open Settings</button>
  </div>

  <div id="main-ui">
    <div class="tabs">
      <button class="tab-btn active" data-target="tab-new-task">New Task</button>
      <button class="tab-btn" data-target="tab-sessions">Active Sessions</button>
    </div>

  <!-- Tab 1: New Task -->
  <div id="tab-new-task" class="tab-content active">

    <!-- Smart Repo Selector -->
    <div class="form-group">
      <label for="repoSearch">Repository <span id="repoDetectedBadge" class="badge badge-success hidden">Detected from GitHub URL</span></label>
      <div class="flex-row">
        <input type="text" id="repoSearch" placeholder="Search or select repository..." list="repoDatalist" autocomplete="off">
        <button id="btnOptions" class="btn" title="Settings">⚙</button>
      </div>
      <datalist id="repoDatalist"></datalist>
      <div id="quickSelectContainer" class="chip-container mt-2">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Prompt Area -->
    <div class="form-group mb-2">
      <label>Prompt Presets</label>
      <div id="presetContainer" class="chip-container">
        <!-- Injected via JS -->
      </div>
    </div>

    <div class="form-group">
      <label for="promptText">Prompt</label>
      <textarea id="promptText" placeholder="Enter instructions for Jules... (Ctrl+Enter to submit)"></textarea>
    </div>

    <div class="form-group mt-2">
      <div class="checkbox-group">
        <input type="checkbox" id="chkAppendUrl">
        <label for="chkAppendUrl">Append source page URL</label>
      </div>
    </div>

    <div class="flex-row mt-2">
      <div class="form-group" style="flex: 1;">
        <label for="inputBranch">Branch</label>
        <input type="text" id="inputBranch" placeholder="e.g. main">
      </div>
    </div>

    <div class="flex-row mt-2">
      <div class="checkbox-group" style="flex: 1;">
        <input type="checkbox" id="chkRequireApproval">
        <label for="chkRequireApproval">Require plan approval</label>
      </div>
      <div class="checkbox-group" style="flex: 1;">
        <input type="checkbox" id="chkAutoPr">
        <label for="chkAutoPr">Auto PR</label>
      </div>
    </div>

    <!-- Status Output -->
    <div id="statusMessage" class="toast"></div>

    <div class="mt-2" style="margin-top: auto;">
      <button id="btnSubmit" class="btn btn-primary" style="width: 100%;">
        Create Session (Ctrl+Enter)
      </button>
    </div>
  </div>

  <!-- Tab 2: Sessions Monitor -->
  <div id="tab-sessions" class="tab-content">
    <div class="flex-row justify-between mb-2">
      <h2>Tracked Tasks</h2>
      <button id="btnRefreshSessions" class="btn">↻ Refresh</button>
    </div>

    <div id="sessionsList" class="session-list">
      <!-- Injected via JS -->
      <div class="text-center" style="color: var(--text-muted);">No active sessions.</div>
    </div>
  </div>

  </div> <!-- main-ui end -->

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
